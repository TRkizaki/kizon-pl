name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI reads the code and nothing else. It holds no secrets and
# no cloud credentials; the tests run against recorded fixtures.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests inside the image
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned to full commit SHAs, with the release as a comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the test stage (runs php artisan test)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test
          cache-from: type=gha,scope=test
          cache-to: type=gha,mode=max,scope=test

  image:
    name: Runtime image
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the app stage
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: app
          tags: kizon-pl:${{ github.sha }}
          cache-from: |
            type=gha,scope=app
            type=gha,scope=test
          cache-to: type=gha,mode=max,scope=app
